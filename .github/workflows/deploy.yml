name: Deploy learning app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check production configuration
        run: node scripts/configure-cloudflare.mjs --production
        env:
          TEACHER_PASSWORD: ${{ secrets.TEACHER_PASSWORD }}
      - run: npm test
      - run: npm run build
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.json
      - name: Deploy Worker
        run: npx wrangler deploy --config dist/server/wrangler.json
      - name: Configure teacher sign-in
        run: node scripts/set-teacher-secret.mjs
        env:
          TEACHER_PASSWORD: ${{ secrets.TEACHER_PASSWORD }}
